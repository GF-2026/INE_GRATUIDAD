<!DOCTYPE html>

<head>

  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    @page { size: A4; margin: 0; }
    html, body { height: 100%; margin: 0; font-family: 'Patrick Hand', cursive; font-size: 20px; line-height: 1.6; background: #ccc; }
    .page { position: relative; width: 210mm; height: 297mm; margin: 0 auto; background: #fff url("page3.jpg") center/cover no-repeat; }
    form { position: absolute; inset: 0; }
    
    /* Contenedores principales */
    .nameComplete, .lastname1_container, .lastname2_container, .tel-container, .date-container1, .since, .city,
    .street, .number, .colony, .municipality, .state, .zipcode { position: absolute; display: flex; gap: 0; }

    .tel-container input { width: 14px; font-size: 20px; text-align: center; }
    
    /* Posiciones de los 6 contenedores principales (separados 100px verticalmente entre sí) */
    .container-1 { position: absolute; top: 60px; left: 160px; display: flex; flex-direction: column; gap: 8px; }
    .container-2 { position: absolute; top: 225px; left: 160px; display: flex; flex-direction: column; gap: 8px; }
    .container-3 { position: absolute; top: 390px; left: 160px; display: flex; flex-direction: column; gap: 8px; }
    .container-4 { position: absolute; top: 555px; left: 160px; display: flex; flex-direction: column; gap: 8px; }
    .container-5 { position: absolute; top: 718px; left: 160px; display: flex; flex-direction: column; gap: 8px; }
    .container-6 { position: absolute; top: 883px; left: 160px; display: flex; flex-direction: column; gap: 8px; }
    
    /* Hilera genérica dentro de los contenedores */
    .clave-hilera { display: flex; gap: 10px; }

    form input { text-align: center; font-size: 16px; border: 1px solid #888; height: 12px; text-transform: uppercase; font-family: 'Patrick Hand', cursive !important; color: #000; }
    
    /* MODIFICACIÓN: Campos de texto circulares para los contenedores */
    .clave-hilera input { 
      width: 14px; 
      height: 14px; 
      border-radius: 50%; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: monospace !important; 
      color: #000; 
      line-height: 14px;
    }

    .lastname1_container input { width: 170px; font-family: monospace !important; color: #000; text-align: center;}
    .lastname2_container input { width: 170px; font-family: monospace !important; color: #000; text-align: center;}
    .city input { width: 100px; }
    .nameComplete input{ text-align: center; width: 190px;}

    .signature-box { position: absolute; bottom: 20px; left: 30px; width: 250px; height: 100px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    .signature-box img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .fullName { position: absolute; bottom: 0px; left: 900px; }
    .fullName input { width: 240px; font-size: 14px; border: 1px solid #888; text-transform: uppercase; text-align: center; font-family: 'Patrick Hand', cursive; }

    /* Dirección inputs */
    .street input { width: 150px; }
    .number input { width: 30px; }
    .colony input { width: 100px; }
    .municipality input { width: 100px; }
    .state input { width: 90px; }
    .zipcode input { width: 55px; }
    .since input { width: 750px; text-align: center;}

    #btnPDF { position: fixed; bottom: 20px; right: 20px; padding: 12px 18px; font-size: 16px; background: #2b6cb0; color: white; border: none; border-radius: 8px; cursor: pointer; z-index: 1000; }
    .no-border-pdf { border: none !important; background: transparent !important; }
    @media print { #btnPDF, #signatureModal { display: none !important; } }

    /* Modal firma */
    #signatureModal { display: none; position: fixed; z-index: 9999; inset: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
    #signatureModal .modal-content { background: #fff; padding: 16px; border-radius: 8px; width: 90%; max-width: 480px; text-align: center; }
#signaturePad {
  display: block;
  width: 100%;
  height: 220px;
  border: none;
  touch-action: none;
  background: transparent;
}
</style>

  <div id="signatureModal">
    <div class="modal-content">
      <p><strong>Firme dentro del recuadro</strong></p>
      <canvas id="signaturePad"></canvas>
      <div style="margin-top:10px;">
        <button id="clearBtn" style="background:#e74c3c;color:#fff;padding:8px 12px;border:none;border-radius:6px;">Limpiar</button>
        <button id="saveBtn" style="background:#2ecc71;color:#fff;padding:8px 12px;border:none;border-radius:6px;">Guardar</button>
        <button id="closeBtn" style="background:#7f8c8d;color:#fff;padding:8px 12px;border:none;border-radius:6px;">Cerrar</button>
      </div>
    </div>
  </div>

  <button id="btnPDF">Descargar PDF.pdf</button>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script><script>
  // ==========================================
  // 1. ELEMENTOS DE LA FIRMA
  // ==========================================
  const modal = document.getElementById('signatureModal');
  const signaturePad = document.getElementById('signaturePad');
  const ctx = signaturePad.getContext('2d');
  const firma1 = document.getElementById('firma1');
  const sigBox1 = document.getElementById('sigBox1');

  let drawing = false;
  let hasSignature = false;
  let lastX = 0;
  let lastY = 0;

  // ==========================================
  // 2. CONFIGURACIÓN DEL ÁREA DE FIRMA
  // ==========================================
  function resizeSignaturePad() {
    const rect = signaturePad.getBoundingClientRect();

    signaturePad.width = rect.width;
    signaturePad.height = rect.height;

    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#000';

    hasSignature = false;
  }

  // Abrir ventana de firma
  sigBox1.addEventListener('click', () => {
    modal.style.display = 'flex';
    resizeSignaturePad();
  });

  // ==========================================
  // 3. DIBUJAR CON MOUSE O DEDO
  // ==========================================
  function getPos(e) {
    const rect = signaturePad.getBoundingClientRect();

    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  signaturePad.addEventListener('pointerdown', (e) => {
    e.preventDefault();

    drawing = true;

    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;

    signaturePad.setPointerCapture(e.pointerId);
  });

  signaturePad.addEventListener('pointermove', (e) => {
    if (!drawing) return;

    e.preventDefault();

    const pos = getPos(e);

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();

    lastX = pos.x;
    lastY = pos.y;

    hasSignature = true;
  });

  function stopDrawing() {
    drawing = false;
  }

  signaturePad.addEventListener('pointerup', stopDrawing);
  signaturePad.addEventListener('pointercancel', stopDrawing);
  signaturePad.addEventListener('lostpointercapture', stopDrawing);

  // ==========================================
  // 4. BOTONES DE LA FIRMA
  // ==========================================
  document.getElementById('clearBtn').onclick = () => {
    ctx.clearRect(
      0,
      0,
      signaturePad.width,
      signaturePad.height
    );

    hasSignature = false;
  };

  document.getElementById('saveBtn').onclick = () => {
    if (hasSignature) {
      firma1.src = signaturePad.toDataURL('image/png');
    } else {
      firma1.removeAttribute('src');
    }

    modal.style.display = 'none';
  };

  document.getElementById('closeBtn').onclick = () => {
    modal.style.display = 'none';
  };

  // ==========================================
  // 5. DESCARGAR PDF
  // ==========================================
  document.getElementById('btnPDF').addEventListener('click', async () => {

    const botonPDF = document.getElementById('btnPDF');
    const pagina = document.querySelector('.page');

    try {
      botonPDF.disabled = true;
      botonPDF.textContent = 'Generando PDF...';

      // Esperar a que la imagen de fondo esté disponible
      const fondo = new Image();
      fondo.src = 'page3.jpg';

      await new Promise((resolve, reject) => {
        if (fondo.complete && fondo.naturalWidth > 0) {
          resolve();
          return;
        }

        fondo.onload = resolve;
        fondo.onerror = () => reject(
          new Error('No se pudo cargar page3.jpg')
        );
      });

      // Esperar a que se carguen las fuentes
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      // Generar imagen de la página completa
      const canvas = await html2canvas(pagina, {
        scale: 2,
        useCORS: true,
        allowTaint: false,
        backgroundColor: '#ffffff',
        logging: false
      });

      const imagen = canvas.toDataURL('image/jpeg', 0.98);

      // Crear PDF tamaño A4
      const { jsPDF } = window.jspdf;

      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4',
        compress: true
      });

      // Ajustar la página al tamaño A4
      pdf.addImage(
        imagen,
        'JPEG',
        0,
        0,
        210,
        297,
        undefined,
        'FAST'
      );

      // Descargar PDF
      pdf.save('HOJA_DE_GRATUIDAD.pdf');

    } catch (error) {
      console.error('Error al generar el PDF:', error);

      alert(
        'No fue posible generar el PDF.\n\n' +
        'Verifica que page3.jpg esté en la carpeta del archivo HTML ' +
        'y que tengas conexión a Internet para cargar las bibliotecas.'
      );

    } finally {
      botonPDF.disabled = false;
      botonPDF.textContent = 'Descargar PDF.pdf';
    }

  });
</script>
